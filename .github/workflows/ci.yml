name: HAMS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
    backend:
        name: Backend CI
        runs-on: ubuntu-latest

        env:
            TEST_DB_URL: jdbc:postgresql://localhost:5432/hams_test_db
            TEST_DB_USERNAME: hams
            TEST_DB_PASSWORD: hams123

        services:
          postgres:
            image: postgres:15
            env:
              POSTGRES_USER: hams_test_db
              POSTGRES_PASSWORD: hams
              POSTGRES_DB: hams123
            ports:
              - 5432:5432
            options: >-
              --health-cmd="pg_isready -U hams_test_db -d hams"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5

        defaults:
            run:
                working-directory: api
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'
            
            - name: Verify Java and Maven
              run: |
                java --version
                mvn --version

            - name: Verify PostgreSQL
              run: |
                PGPASSWORD="$TEST_DB_PASSWORD" \
                psql \
                -h localhost \
                -p 5432 \
                -U "$TEST_DB_USERNAME" \
                -d hams_test_db \
                -c "SELECT current_database(), current_user;"
                    
            - name: Build and Test
              env:
                TEST_DB_URL: jdbc:postgresql://localhost:5432/hams_test_db
                TEST_DB_USERNAME: hams
                TEST_DB_PASSWORD: hams123
              run: mvn clean verify
        
    frontend:
        name: Frontend CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 11.5.2
                run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: 'pnpm'
                cache-dependency-path: ui/pnpm-lock.yaml
            
            - name: Verify node and pnpm versions
              run: |
                node -v
                pnpm -v

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Tests
              run: pnpm test
            
            - name: Build
              run: pnpm build
    