name: HAMS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
    backend:
        name: Backend CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'
            
            - name: Build and Test
              run: mvn clean verify
        
    frontend:
        name: Frontend CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: 'pnpm'
                cache-dependency-path: ui/pnpm-lock.yaml
            
            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Tests
              run: pnpm test
            
            - name: Build
              run: pnpm build
    