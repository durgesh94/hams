name: HAMS CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
    backend:
        name: Backend CI
        runs-on: ubuntu-latest

        env:
            TEST_DB_URL: jdbc:postgresql://localhost:5432/hams_test_db
            TEST_DB_USERNAME: hams
            TEST_DB_PASSWORD: hams123

        services:
          postgres:
            image: postgres:17
            env:
              POSTGRES_USER: hams
              POSTGRES_PASSWORD: hams123
              POSTGRES_DB: hams_test_db
            ports:
              - 5432:5432
            options: >-
              --health-cmd="pg_isready -U hams -d hams_test_db"
              --health-interval=10s
              --health-timeout=5s
              --health-retries=5

        defaults:
            run:
                working-directory: api
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Java 21
              uses: actions/setup-java@v4
              with:
                java-version: '21'
                distribution: 'temurin'
                cache: 'maven'
            
            - name: Verify Java and Maven
              run: |
                java --version
                mvn --version
            
            - name: Check code formatting
              run: mvn spotless:check
                    
            - name: Build and Test
              run: mvn clean verify

            - name: SonarCloud analysis
              run: mvn sonar:sonar
              env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            
            - name: Publish Backend Test Results
              if: always()
              uses: dorny/test-reporter@v2
              with:
                name: Backend Test Report
                path: api/target/surefire-reports/*.xml
                reporter: java-junit

            - name: Upload JaCoCo Coverage Report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: backend-jacoco-report
                path: api/target/site/jacoco/
        
    frontend:
        name: Frontend CI
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ui
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 11.5.2
                run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: 'pnpm'
                cache-dependency-path: ui/pnpm-lock.yaml
            
            - name: Verify node and pnpm versions
              run: |
                node -v
                pnpm -v

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check Linting
              run: pnpm lint

            - name: Check code formatting
              run: pnpm format:check

            - name: Run Tests with Coverage
              run: pnpm test:coverage
            
            - name: Build
              run: pnpm build
    